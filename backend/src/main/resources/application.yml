spring:
  application:
    name: ptms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ptms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ptms}
    password: ${SPRING_DATASOURCE_PASSWORD:ptms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
server:
  servlet:
    context-path: /ptms
azure:
  document-intelligence:
    endpoint: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:}
    key: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:}
    model-id: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL_ID:prebuilt-layout}
    api-version: ${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION:2024-11-30}
    poll-interval-ms: ${AZURE_DOCUMENT_INTELLIGENCE_POLL_INTERVAL_MS:750}
    timeout-seconds: ${AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_SECONDS:45}
