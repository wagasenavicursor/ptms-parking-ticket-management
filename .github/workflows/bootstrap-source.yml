name: Import PTMS source

on:
  push:
    branches: [developer]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout developer branch
        uses: actions/checkout@v4
        with:
          ref: developer
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          cat bootstrap/ptms-source.part1 \
              bootstrap/ptms-source.part2 \
              bootstrap/ptms-source.part3a \
              bootstrap/ptms-source.part3b \
              bootstrap/ptms-source.part3c \
              bootstrap/ptms-source.part3d \
              bootstrap/ptms-source.part3e \
              bootstrap/ptms-source.part3f \
              bootstrap/ptms-source.part3g \
              bootstrap/ptms-source.part3h \
              bootstrap/ptms-source.part3i \
              bootstrap/ptms-source.part3j \
              bootstrap/ptms-source.part3k \
              bootstrap/ptms-source.part3l \
              bootstrap/ptms-source.part3m > /tmp/ptms-source.b64
          base64 --decode /tmp/ptms-source.b64 > /tmp/ptms-source.tar.xz
          tar -xJf /tmp/ptms-source.tar.xz -C .

      - name: Remove transport and workflow files from imported archive
        shell: bash
        run: |
          rm -rf bootstrap
          rm -f bootstrap-test.txt
          rm -f .github/workflows/ci.yml

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name 'PTMS Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import PTMS Spring Boot and Angular application'
          git push origin HEAD:developer
