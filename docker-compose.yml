services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ptms
      MYSQL_USER: ptms
      MYSQL_PASSWORD: ptms
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["ptms_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  ptms_mysql:
